name: Publish signed ASB

on:
  push:
    tags: ['managed-v*.*.*']

permissions:
  contents: read

concurrency:
  group: asb-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/managed-profile
          if [[ ! "$GITHUB_REF_NAME" =~ ^managed-v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "Use managed-vMAJOR.MINOR.PATCH with minor and patch below 1000."
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          if (( code < 1 || code > 2100000000 )); then
            echo "Version code is outside Android distribution limits."
            exit 1
          fi
          {
            echo "ASB_VERSION_CODE=$code"
            echo "ASB_VERSION_NAME=${GITHUB_REF_NAME#managed-v}"
          } >> "$GITHUB_ENV"
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build and verify the signed APK
        shell: bash
        env:
          ASB_KEYSTORE_BASE64: ${{ secrets.ASB_MANAGED_KEYSTORE_BASE64 }}
          ASB_KEYSTORE_PASSWORD: ${{ secrets.ASB_MANAGED_KEYSTORE_PASSWORD }}
          ASB_KEY_ALIAS: ${{ secrets.ASB_MANAGED_KEY_ALIAS }}
          ASB_KEY_PASSWORD: ${{ secrets.ASB_MANAGED_KEY_PASSWORD }}
          ASB_SIGNER_SHA256: ${{ vars.ASB_MANAGED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          : "${ASB_KEYSTORE_BASE64:?Set the existing signing key secret}"
          : "${ASB_KEYSTORE_PASSWORD:?Set the store password secret}"
          : "${ASB_KEY_ALIAS:?Set the signing alias secret}"
          : "${ASB_KEY_PASSWORD:?Set the signing key password secret}"
          : "${ASB_SIGNER_SHA256:?Pin the signing certificate fingerprint}"
          umask 077
          export ASB_KEYSTORE="$RUNNER_TEMP/asb-release.keystore"
          trap 'rm -f "$ASB_KEYSTORE"' EXIT
          printf '%s' "$ASB_KEYSTORE_BASE64" | base64 --decode > "$ASB_KEYSTORE"
          unset ASB_KEYSTORE_BASE64
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          report="$("$apksigner" verify --print-certs "$apk")"
          actual="$(awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ { print tolower($2) }' <<< "$report")"
          expected="$(tr -d ':[:space:]' <<< "$ASB_SIGNER_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$actual" =~ ^[a-f0-9]{64}$ || "$actual" != "$expected" ]]; then
            echo "The release signing certificate does not match the pinned fingerprint."
            exit 1
          fi
          cp "$apk" ASB.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ASB.apk --verify-tag --generate-notes --latest=false
