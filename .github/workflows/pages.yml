name: Publish Wiki
on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asb-pages
  cancel-in-progress: false

jobs:
  wiki:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wiki/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm --prefix wiki ci && npm --prefix wiki run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/dist
      - uses: actions/deploy-pages@v4
        id: publish
